name: CI-CD Deployment

on:
  push:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/myapp:${{ github.sha }}
```[cite: 15]

### **Step 3: Commit and Push (2 minutes)**
Run these commands in your project terminal:
```bash
git add .
git commit -m "Configure CI-CD pipeline with GitHub Actions"
git push origin main
```[cite: 14]

### **Step 4: Verify Execution (4 minutes)**
1. Go to your GitHub repository and click on the **Actions** tab[cite: 13].
2. Click on the running workflow to watch the automated steps (Checkout, Python Setup, Dependencies, PyTest, Docker Login, and Image Build/Push) turn green[cite: 13, 16].
3. Log in to your **Docker Hub** account to confirm that your repository (`myapp`) contains the new image tagged with your commit SHA[cite: 17].
